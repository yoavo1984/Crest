services:
  website:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./Website:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      help-center:
        condition: service_healthy
    labels:
      base44.project: Crest Website
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || { echo 'Website failed'; exit 1; }; wget -q -O /dev/null http://127.0.0.1/guides/ || { echo 'Help Center proxy failed'; exit 1; }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  help-center:
    image: node:22
    restart: on-failure
    working_dir: /workspace/HelpCenter
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm start -- --host 0.0.0.0 --port 3001 --no-open"]
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - help_node_modules:/workspace/HelpCenter/node_modules
      - help_generated:/workspace/HelpCenter/.docusaurus
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    labels:
      base44.project: Crest Help Center
      base44.kind: web
      base44.port: "3001"
      base44.docs: /guides/
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/guides/', {signal: AbortSignal.timeout(5000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 180s

volumes:
  help_node_modules:
  help_generated:
