map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The website is authored as static HTML/CSS/JS, served directly from source.
    # Do not serve the committed production guides: use Docusaurus development.
    location = /guides {
        return 302 /guides/;
    }

    # Docusaurus uses /ws for live reload even when its base URL is /guides/.
    location ~ ^/(guides/|ws$) {
        proxy_pass http://help-center:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
